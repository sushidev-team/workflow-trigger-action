name: Test Action

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Action
        id: test
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          event_type: 'test-dispatch'
          target_repo: ${{ github.repository }}
          client_payload: |
            {
              "version": "${{ github.sha }}",
              "environment": "test"
            }

      - name: Display Results
        run: |
          echo "Triggered: ${{ steps.test.outputs.triggered }}"
