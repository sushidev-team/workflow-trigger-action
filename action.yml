name: 'Repository Dispatch Trigger'
description: 'Triggers workflows via repository_dispatch with a single API call'
author: 'Sushi Dev GmbH'

inputs:
  github_token:
    description: 'GitHub token for API access'
    required: true
  target_repo:
    description: 'Target repository (owner/repo format)'
    required: false
    default: ${{ github.repository }}
  event_type:
    description: 'The repository_dispatch event type (e.g., "docker-stage")'
    required: true
  ref:
    description: 'Git reference (passed inside client_payload for target workflows to use)'
    required: false
    default: 'master'
  client_payload:
    description: 'JSON object to send as client_payload'
    required: false
    default: '{}'

outputs:
  triggered:
    description: 'Whether the dispatch was successful (true/false)'
    value: ${{ steps.dispatch.outputs.triggered }}

runs:
  using: 'composite'
  steps:
    - name: Send Repository Dispatch
      id: dispatch
      shell: bash
      run: |
        echo "Dispatching event '${{ inputs.event_type }}' to ${{ inputs.target_repo }}"

        # Build payload: merge ref into client_payload
        payload=$(cat <<'EOFPAYLOAD'
        ${{ inputs.client_payload }}
        EOFPAYLOAD
        )
        # Ensure payload is valid JSON, default to empty object
        if ! echo "$payload" | jq empty 2>/dev/null; then
          echo "Warning: client_payload is not valid JSON, using empty object"
          payload='{}'
        fi
        # Inject ref into the payload
        payload=$(echo "$payload" | jq --arg ref "${{ inputs.ref }}" '. + {ref: $ref}')

        body=$(jq -n --arg et "${{ inputs.event_type }}" --argjson cp "$payload" \
          '{event_type: $et, client_payload: $cp}')

        echo "Payload: $body"

        # Retry logic: 3 attempts with exponential backoff
        for attempt in 1 2 3; do
          response=$(curl -s -o /tmp/dispatch_response.txt -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ inputs.github_token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ inputs.target_repo }}/dispatches" \
            -d "$body")

          if [ "$response" = "204" ]; then
            echo "Successfully dispatched event '${{ inputs.event_type }}'"
            echo "triggered=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          response_body=$(cat /tmp/dispatch_response.txt 2>/dev/null || echo "")
          echo "Attempt $attempt failed with HTTP $response: $response_body"

          if [ "$attempt" -lt 3 ]; then
            delay=$((attempt * 5))
            echo "Retrying in ${delay}s..."
            sleep "$delay"
          fi
        done

        echo "Failed to dispatch after 3 attempts"
        echo "triggered=false" >> "$GITHUB_OUTPUT"
        exit 1

branding:
  icon: 'play'
  color: 'blue'
